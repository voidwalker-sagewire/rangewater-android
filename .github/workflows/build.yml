# 🪨 BLOCK 1 — CONTINUOUS INTEGRATION BUILD RUNNER
# 🎮 Behavior: Validates the wrapper, runs JVM and real Room database tests,
#    builds a stable-signed field APK, verifies its certificate, compiles the Play
#    release bundle path, and retains both verification artifacts.
name: Build RangeWater Field APK and Play Bundle

on:
  push:
    branches: [ "main", "codex/rw-tx-008-jct-rev2", "codex/rw-tx-009-gte", "codex/rw-tx-010-hrd", "codex/rw-tx-011-bkr", "codex/rw-tx-012-mch", "codex/rw-tx-013-ply" ]
  workflow_dispatch:

jobs:
  imagery-gateway-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: imagery-gateway/package-lock.json

      - name: Install Gateway Dependencies
        working-directory: imagery-gateway
        run: npm ci

      - name: Test Imagery Gateway
        working-directory: imagery-gateway
        run: npm test

  build:
    runs-on: ubuntu-latest
    env:
      RANGEWATER_FIELD_KEYSTORE_BASE64: ${{ secrets.RANGEWATER_FIELD_KEYSTORE_BASE64 }}
      RANGEWATER_FIELD_STORE_PASSWORD: ${{ secrets.RANGEWATER_FIELD_STORE_PASSWORD }}
      RANGEWATER_FIELD_KEY_ALIAS: ${{ secrets.RANGEWATER_FIELD_KEY_ALIAS }}
      RANGEWATER_FIELD_KEY_PASSWORD: ${{ secrets.RANGEWATER_FIELD_KEY_PASSWORD }}
      RANGEWATER_FIELD_CERT_SHA256: 94B08C24083F621C7164E112617CDB31CA97155CC1E2CCE86EE50974F5D1F001
      RANGEWATER_PLAY_UPLOAD_KEYSTORE_BASE64: ${{ secrets.RANGEWATER_PLAY_UPLOAD_KEYSTORE_BASE64 }}
      RANGEWATER_PLAY_UPLOAD_STORE_PASSWORD: ${{ secrets.RANGEWATER_PLAY_UPLOAD_STORE_PASSWORD }}
      RANGEWATER_PLAY_UPLOAD_KEY_ALIAS: ${{ secrets.RANGEWATER_PLAY_UPLOAD_KEY_ALIAS }}
      RANGEWATER_PLAY_UPLOAD_KEY_PASSWORD: ${{ secrets.RANGEWATER_PLAY_UPLOAD_KEY_PASSWORD }}
      RANGEWATER_PLAY_UPLOAD_CERT_SHA256: 87F501E40E9CCB8CFE83560482D99770783B66F01E45730D139D206F4A392832

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Validate and Configure Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission to Wrapper
        run: chmod +x ./gradlew

      - name: Prepare Stable Field Signing Key
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RANGEWATER_FIELD_KEYSTORE_BASE64"
          test -n "$RANGEWATER_FIELD_STORE_PASSWORD"
          test -n "$RANGEWATER_FIELD_KEY_ALIAS"
          test -n "$RANGEWATER_FIELD_KEY_PASSWORD"
          keystore_path="$RUNNER_TEMP/rangewater-field.jks"
          echo "RANGEWATER_FIELD_KEYSTORE_PATH=$keystore_path" >> "$GITHUB_ENV"
          printf '%s' "$RANGEWATER_FIELD_KEYSTORE_BASE64" \
            | base64 --decode > "$keystore_path"
          chmod 600 "$keystore_path"

          actual_fingerprint="$(
            keytool -list -v \
              -keystore "$keystore_path" \
              -storepass:env RANGEWATER_FIELD_STORE_PASSWORD \
              -alias "$RANGEWATER_FIELD_KEY_ALIAS" \
              | sed -n 's/.*SHA256: //p' \
              | tr -d ':'
          )"
          test "$actual_fingerprint" = "$RANGEWATER_FIELD_CERT_SHA256"

      - name: Run Debug JVM Unit Tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Enable KVM for Android Emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Room Instrumentation Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest --stacktrace

      - name: Compile Stable-Signed Field APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Verify Built APK Certificate
        shell: bash
        run: |
          set -euo pipefail
          apksigner_path="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$apksigner_path"
          certificate_output="$(
            "$apksigner_path" verify --print-certs app/build/outputs/apk/debug/app-debug.apk
          )"
          actual_fingerprint="$(
            printf '%s\n' "$certificate_output" \
              | awk -F': ' '/certificate SHA-256 digest/ { print $NF; exit }' \
              | tr -d '\r:' \
              | tr '[:lower:]' '[:upper:]'
          )"
          test -n "$actual_fingerprint"
          echo "Built APK certificate SHA-256: $actual_fingerprint"
          test "$actual_fingerprint" = "$RANGEWATER_FIELD_CERT_SHA256"
          mkdir -p app/build/outputs/field
          cp app/build/outputs/apk/debug/app-debug.apk \
            app/build/outputs/field/RangeWater-1.0.0-field.apk

      - name: Upload Stable Field APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RangeWater-Field-APK
          path: app/build/outputs/field/RangeWater-1.0.0-field.apk
          retention-days: 30

      - name: Prepare Google Play Upload Key
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RANGEWATER_PLAY_UPLOAD_KEYSTORE_BASE64"
          test -n "$RANGEWATER_PLAY_UPLOAD_STORE_PASSWORD"
          test -n "$RANGEWATER_PLAY_UPLOAD_KEY_ALIAS"
          test -n "$RANGEWATER_PLAY_UPLOAD_KEY_PASSWORD"
          keystore_path="$RUNNER_TEMP/rangewater-play-upload.jks"
          echo "RANGEWATER_PLAY_UPLOAD_KEYSTORE_PATH=$keystore_path" >> "$GITHUB_ENV"
          printf '%s' "$RANGEWATER_PLAY_UPLOAD_KEYSTORE_BASE64" \
            | base64 --decode > "$keystore_path"
          chmod 600 "$keystore_path"

          actual_fingerprint="$(
            keytool -list -v \
              -keystore "$keystore_path" \
              -storepass:env RANGEWATER_PLAY_UPLOAD_STORE_PASSWORD \
              -alias "$RANGEWATER_PLAY_UPLOAD_KEY_ALIAS" \
              | sed -n 's/.*SHA256: //p' \
              | tr -d ':'
          )"
          test "$actual_fingerprint" = "$RANGEWATER_PLAY_UPLOAD_CERT_SHA256"

      - name: Compile Signed Play Release Bundle
        run: ./gradlew bundleRelease --stacktrace

      - name: Verify and Stage Signed Play Bundle
        shell: bash
        run: |
          set -euo pipefail
          bundle_path="app/build/outputs/bundle/release/app-release.aab"
          test -f "$bundle_path"
          jarsigner -verify -strict "$bundle_path"
          actual_fingerprint="$(
            keytool -printcert -jarfile "$bundle_path" \
              | sed -n 's/.*SHA256: //p' \
              | tr -d ':'
          )"
          test -n "$actual_fingerprint"
          echo "Signed AAB certificate SHA-256: $actual_fingerprint"
          test "$actual_fingerprint" = "$RANGEWATER_PLAY_UPLOAD_CERT_SHA256"
          mkdir -p app/build/outputs/play
          cp "$bundle_path" app/build/outputs/play/RangeWater-1.0.0-play-upload.aab

      - name: Upload Signed Play Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RangeWater-Play-AAB
          path: app/build/outputs/play/RangeWater-1.0.0-play-upload.aab
          retention-days: 30
