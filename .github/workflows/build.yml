# 🪨 BLOCK 1 — CONTINUOUS INTEGRATION BUILD RUNNER
# 🎮 Behavior: Validates the wrapper, builds a debug APK, and retains the artifact.
name: Build RangeWater Debug APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Validate and Configure Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission to Wrapper
        run: chmod +x ./gradlew

      - name: Compile Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RangeWater-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
