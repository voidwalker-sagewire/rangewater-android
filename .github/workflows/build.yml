# 🪨 BLOCK 1 — CONTINUOUS INTEGRATION BUILD RUNNER
# 🎮 Behavior: Validates the wrapper, runs JVM and real Room database tests,
#    builds a debug APK, and retains the artifact.
name: Build RangeWater Debug APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Validate and Configure Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission to Wrapper
        run: chmod +x ./gradlew

      - name: Run Debug JVM Unit Tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Enable KVM for Android Emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Room Instrumentation Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest --stacktrace

      - name: Compile Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RangeWater-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
